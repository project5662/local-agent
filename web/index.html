<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lagerassistent">
  <title>Lagerassistent / Warehouse Assistant</title>

  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1d1f23;
      --muted: #6b7280;
      --accent: #2563eb;
      --user-bg: #2563eb;
      --user-text: #ffffff;
      --agent-bg: #e5e7eb;
      --agent-text: #1d1f23;
      --border: rgba(127, 127, 127, 0.25);
      --radius: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111318;
        --card: #1a1d24;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --accent: #3b82f6;
        --agent-bg: #262a33;
        --agent-text: #f3f4f6;
      }
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ---------- Header ---------- */
    header {
      padding: 14px 16px;
      padding-top: calc(14px + env(safe-area-inset-top));
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 18px;
      margin: 0;
    }

    header p {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    /* ---------- Chat ---------- */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: var(--radius);
      line-height: 1.45;
      font-size: 15px;
      white-space: pre-wrap;   /* behåller radbrytningar i svaren */
      word-wrap: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }

    .msg.agent {
      align-self: flex-start;
      background: var(--agent-bg);
      color: var(--agent-text);
      border-bottom-left-radius: 4px;
    }

    .msg .lang-note {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      opacity: 0.7;
    }

    /* ---------- Snabbknappar ---------- */
    #suggestions {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 16px;
      scrollbar-width: none;
    }

    #suggestions::-webkit-scrollbar { display: none; }

    #suggestions button {
      flex-shrink: 0;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
      text-align: left;
    }

    #suggestions button small {
      display: block;
      font-size: 11px;
      color: var(--muted);
    }

    /* ---------- Status ---------- */
    #thinking,
    #error {
      padding: 0 16px 6px;
      font-size: 13px;
      min-height: 18px;
    }

    #thinking { color: var(--muted); }
    #error { color: #dc2626; }

    .hidden { display: none !important; }

    /* ---------- Diagram ---------- */
    .msg.chart {
      max-width: 100%;
      width: 100%;
      font-size: 13px;
    }

    .msg.chart svg {
      width: 100%;
      height: auto;
      display: block;
      margin-top: 8px;
      color: var(--agent-text);
    }

    /* ---------- Inmatning ---------- */
    #ask-form {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      background: var(--card);
      border-top: 1px solid var(--border);
    }

    #question {
      flex: 1;
      min-width: 0;
      font-size: 16px;        /* 16px hindrar iPhone från att zooma in */
      padding: 12px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      outline: none;
    }

    #question:focus {
      border-color: var(--accent);
    }

    #send {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 0 20px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    #send:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>

<body>
  <header>
    <h1>Lagerassistent / Warehouse Assistant</h1>
    <p>Fråga om lagersaldo, artiklar och platser / Ask about stock, articles and locations</p>
  </header>

  <main id="chat">
    <!-- Välkomstmeddelande / welcome message -->
    <div class="msg agent">
      Hej! Vad vill du veta om lagret?
      <span class="lang-note">Hi! What would you like to know about the warehouse?</span>
    </div>

    <!-- TODO: meddelanden från användaren och agenten ska läggas till här
         (skapa en <div class="msg user"> eller <div class="msg agent">) -->

    </div>
  </main>

  <div id="suggestions">
    <button type="button" data-question="how much stock of ART-00004 is there in total?">
      Lagersaldo för en artikel
      <small>Stock for one article</small>
    </button>
    <button type="button" data-question="which article has the lowest total stock?">
      Minst lager
      <small>Lowest stock</small>
    </button>
    <button type="button" data-question="list all the locations where we have stock">
      Alla orter
      <small>All locations</small>
    </button>
    <button type="button" data-question="give me a chart of how the stock is distributed across the warehouses">
      Diagram
      <small>Chart</small>
    </button>
  </div>

  <div id="thinking" class="hidden">Tänker… / Thinking…</div>
  <div id="error" class="hidden">Kunde inte nå servern / Could not reach the server</div>

  <div style="padding: 8px 16px; background: var(--card); border-top: 1px solid var(--border);">
    <label for="model" style="font-size: 13px; color: var(--muted);">Modell / Model:</label>
    <select id="model" style="font-size: 14px; padding: 4px 8px; border-radius: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border);">
      <option value="7b">7b (snabb / fast)</option>
      <option value="14b">14b (bättre / better)</option>
      <option value="3.8">3.8 (största / largest)</option>
    </select>
  </div>

  <form id="ask-form">
    <input id="question" type="text" placeholder="Ställ en fråga / Ask a question" autocomplete="off" required>
    <button id="send" type="submit">Skicka / Send</button>
  </form>

  <script>
    // Kopplingen till agenten (/ask) byggs här nedan.
    // De här elementen behöver du i scriptet (alla finns i HTML:en ovan):
    //   #chat, #ask-form, #question, #send, #suggestions, #thinking, #error
    
    // TODO 1: hämta elementen med document.getElementById
    //         och alla snabbknappar med document.querySelectorAll("#suggestions button")

    // TODO 2: lyssna på "submit" på #ask-form och stoppa standardbeteendet
    //         (event.preventDefault()), annars laddas sidan om.

    // TODO 3: snabbknapparna ska fylla i frågan (data-question) och skicka den.

    // TODO 4: skicka frågan till servern:
    //         fetch("/ask", { method: "POST", headers: {...}, body: JSON.stringify({ question }) })

    // TODO 5: lägg till användarens fråga i #chat som <div class="msg user">,
    //         och agentens svar som <div class="msg agent"> när det kommer.
    //         Ledtråd: använd textContent, inte innerHTML.

    // TODO 6: visa #thinking medan du väntar, stäng av #send, och göm #thinking igen när svaret kommer.

    // TODO 7: visa #error om något går fel, och rensa felet när nästa fråga skickas.

    // TODO 8: scrolla #chat till botten efter varje nytt meddelande.

    const chat = document.getElementById("chat")
    const form = document.getElementById("ask-form")
    const input = document.getElementById("question");
    const sendButton = document.getElementById("send")
    const thinking = document.getElementById("thinking")
    const errorBox = document.getElementById("error")
    const suggestionButtons = document.querySelectorAll("#suggestions button");

    function addMessages(text, who) {
        const div = document.createElement("div")
        div.className = "msg " + who;
        // Ta bort markdown-kodblockens markörer (```) så att de inte syns i webbläsaren
        // Diagram använder mellanslag för att få kolumner, då behövs ett typsnitt med lika breda tecken
        if (text.includes("█")) {
            div.style.fontFamily = "ui-monospace, Menlo, Monaco, monospace";
            div.style.fontSize = "13px";
        }
        div.textContent = text
            .replace(/^```.*$/gm, "")
            .replace(/\*\*(.+?)\*\*/g, "$1")
            .replace(/\n{3,}/g, "\n\n")
            .trim();
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    // Ett sessions-ID som finns kvar när sidan laddas om, så att servern minns samtalet
    let sessionId = localStorage.getItem("sessionId");
    if (!sessionId) {
        sessionId = crypto.randomUUID();
        localStorage.setItem("sessionId", sessionId);
    }

    async function askAgent(question) {
        addMessages(question, "user");
        thinking.classList.remove("hidden");
        errorBox.classList.add("hidden");
        sendButton.disabled = true;

        try{
            const res = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: question, session_id: sessionId, model: document.getElementById("model").value }),
            });
            if (!res.ok) throw new Error("HTTP" + res.status);
            const data = await res.json();
            addMessages(data.answer, "agent");     
        } catch (err) {
            errorBox.classList.remove("hidden");
        } finally {
            thinking.classList.add("hidden");
            sendButton.disabled = false;
        }   
    }

    // Ritar ett stapeldiagram med SVG, från en riktig datakälla (inte via modellen)
    async function showChart() {
        try {
            const res = await fetch("/chart/stock-by-location");
            if (!res.ok) throw new Error("HTTP " + res.status);
            const data = await res.json();
            const items = data.locations;
            const max = Math.max(...items.map(item => item.total));

            const NS = "http://www.w3.org/2000/svg";
            const barWidth = 18;
            const gap = 8;
            const chartHeight = 160;
            const labelSpace = 90;
            const width = items.length * (barWidth + gap) + 20;

            const svg = document.createElementNS(NS, "svg");
            svg.setAttribute("viewBox", `0 0 ${width} ${chartHeight + labelSpace}`);

            items.forEach(function (item, i) {
                const x = 10 + i * (barWidth + gap);
                const h = max > 0 ? (item.total / max) * chartHeight : 0;

                const rect = document.createElementNS(NS, "rect");
                rect.setAttribute("x", x);
                rect.setAttribute("y", chartHeight - h);
                rect.setAttribute("width", barWidth);
                rect.setAttribute("height", h);
                rect.style.fill = "var(--accent)";
                svg.appendChild(rect);

                const label = document.createElementNS(NS, "text");
                label.setAttribute("transform", `translate(${x + barWidth / 2 + 4}, ${chartHeight + 8}) rotate(45)`);
                label.setAttribute("font-size", "10");
                label.setAttribute("fill", "currentColor");
                label.textContent = item.location;
                svg.appendChild(label);
            });

            const bubble = document.createElement("div");
            bubble.className = "msg agent chart";

            const caption = document.createElement("div");
            caption.textContent = "Totalt lagersaldo per ort (st) / Total stock per location (units)";
            bubble.appendChild(caption);
            bubble.appendChild(svg);

            chat.appendChild(bubble);
            chat.scrollTop = chat.scrollHeight;
        } catch (err) {
            errorBox.classList.remove("hidden");
        }
    }

    form.addEventListener("submit", function (event) {
        event.preventDefault();
        const question = input.value.trim();
        if (!question) return;
        input.value = "";
        askAgent(question);
    });

    suggestionButtons.forEach(function (button) {
        button.addEventListener("click", function () {
            askAgent(button.dataset.question);
        });
    });
  </script>
</body>
</html>
