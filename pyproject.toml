[project]
name = "local-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ollama",
    "chromadb",
    "click",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
agent = "agent.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

